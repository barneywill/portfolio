<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weiwei Wu's Blog - English</title>
    <link rel="stylesheet" href="./css/style_blog.css">
</head>
<body>
    <div class="language-switch">
        <button class="lang-btn active" onclick="location.href='index_cn.html'">中文</button>
        <button class="lang-btn active">English</button>
    </div>

    <header>
        <h1>✨ Weiwei Wu's Blog</h1>
        <p>Big Data | System Architecture | Problem Solving</p>
    </header>

    <div class="container">
        <div class="stats-section">
            <div class="stat-item">
                <h4>368</h4>
                <p>Articles Translated</p>
            </div>
            <div class="stat-item">
                <h4>10+</h4>
                <p>Years of Content</p>
            </div>
            <div class="stat-item">
                <h4>20+</h4>
                <p>Topic Categories</p>
            </div>
            <div class="stat-item">
                <h4>1M+</h4>
                <p>Total Views</p>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Big Data</button>
            <button class="filter-btn">System Design</button>
            <button class="filter-btn">DevOps</button>
            <button class="filter-btn">Problem Solving</button>
        </div>

        <div class="tech-stack-section">
            <h3>💡 Technology Stack</h3>
            <div class="component-badges" id="componentBadges"></div>
            <div class="filter-info" id="filterInfo"></div>
        </div>

        <div class="posts-grid" id="postsGrid"></div>

        <div class="pagination" id="pagination"></div>
    </div>

    <footer>
        <p>&copy; 2026 Weiwei Wu's Blog. </p>
    </footer>

    <script src="./js/index-en-script.js"></script>
</body>
</html>
