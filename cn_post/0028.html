<p>linux桌面有时会出现蓝牙失效的情况，这时所有蓝牙设备都连接不上，通过重启或者开关蓝牙都无法解决问题，而且设备无法通过删除之后重新添加的方式恢复连接<br/>
蓝牙命令行</p>
