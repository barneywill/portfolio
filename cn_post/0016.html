<p>impala从3.1版本开始支持orc格式查询，不过是experimental</p>
<p><picture>
  <source srcset="../img/1509647-20220520171612469-583698543.webp" type="image/webp">
  <img alt="" src="../img/1509647-20220520171612469-583698543.png">
</picture></p>
<p>开启方法，在cdh的impala配置中添加 --enable_orc_scanner=true</p>
<p><picture>
  <source srcset="../img/1509647-20220520171626508-1764201579.webp" type="image/webp">
  <img alt="" src="../img/1509647-20220520171626508-1764201579.png">
</picture></p>
<p>然后重启impala集群。</p>
<p>官方文档：<br/>
<a href="https://docs.cloudera.com/documentation/enterprise/latest/topics/impala_orc.html" rel="noopener nofollow" target="_blank">https://docs.cloudera.com/documentation/enterprise/latest/topics/impala_orc.html</a></p>
